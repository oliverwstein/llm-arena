# Model configurations for tournament
#
# Each model can be:
#   1. An LLM model (requires API key)
#   2. A built-in bot (set force_fallback: true)
#
# If an LLM model's API key is missing, it automatically falls back to a random bot.
#
# Built-in bot types (use with force_fallback: true):
#   - random: Makes random legal moves
#   - heuristic: Uses poke-env's SimpleHeuristicsPlayer
#
# For external bots like Technical Machine, run them as separate processes
# that connect to the same Pokemon Showdown server.

models:
  # Anthropic
  - name: "Claude-Opus-4.5"
    model: "claude-opus-4-5-20251101"
    temperature: 0.7
    team: "Raw-Teams/Mixed-Jirachi-Gengar-Offense.md"

